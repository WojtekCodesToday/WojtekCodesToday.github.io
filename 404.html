<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>
    <p>Moving to wjgm.pl<br>
    <img src="https://wjgm.pl" loading="lazy">
    <br>
    If you aren't redirected, <a id="manual-link" href="#">click here</a>.</p>
    
    <script>
        const l = window.location;
        const cleanPath = l.pathname.startsWith('/') ? l.pathname : '/' + l.pathname;
        const newURL = "https://wjgm.pl" + cleanPath + l.search + l.hash;
        document.getElementById('manual-link').href = newURL;
        window.location.replace(newURL);
    </script>
</body>
</html>
